        <label from="senha">senha (minimo 8 caracteres):</label><br>
        <input type="password" id="senha" minlength="8" required><br><br>
 
        ><button type="submit">Cadastrar</button>
    </from>

    <script>
        document.getElementById('fromCadastro').addEventListener('submit',async(e)=>{
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const FeedbackEl = document.getElementById('feedback');
 
            if (senha.length<8){
                mensagemEl.textContent ="A senha deve conter no minimo 8 caracteres.";
                mensagemEl.style.color ="red";
                return;
            }
 
            try{
                const resposta = await fetch('http://localhost:8080/api/cadastrar',{
                    method :'POST',

                if(resposta.ok){

                     mensagemEl.textContent = resultado.mensagem;
